name: Daily Release

on:
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）自动检查；有新的打包内容且当日未发版时自动递增版本号发版（08:15 由 store-index 自动采集）。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish a new patch release even without new package changes"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: plugin-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release-notes
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan version and package plugin
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          FORCE: ${{ inputs.force == true && 'true' || 'false' }}
        run: |
          node --input-type=module - <<'JS'
          import { execFileSync, spawn } from "node:child_process";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          const CHINESE = /[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\ufe10-\ufe1f\ufe30-\ufe4f\uff00-\uffef\u{20000}-\u{2ffff}\u{30000}-\u{323af}]/u;
          const HAN = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\u{20000}-\u{2ffff}\u{30000}-\u{323af}]/u;
          const EMOJI = /[©®‼⁉™ℹ↔-↙↩↪⌚-⌛⌨⏏⏩-⏳⏸-⏺Ⓜ▪▫▶◀◻-◾\u2600-\u27bf⤴⤵⬅-⬇⬛⬜⭐⭕〰〽㊗㊙\u20e3\ufe00-\ufe0f\u{1f000}-\u{1faff}]/u;
          const MAX_README_BYTES = 512 * 1024;
          const utf8Decoder = new TextDecoder("utf-8", { fatal: true });

          function requireCond(condition, message) {
            if (!condition) {
              throw new Error(message);
            }
          }

          function isPlainObject(value) {
            return value !== null && typeof value === "object" && !Array.isArray(value);
          }

          function checkText(value, locale, context) {
            if (typeof value === "string") {
              requireCond(!EMOJI.test(value), `${context}: emoji in ${JSON.stringify(value)}`);
              if (String(locale).toLowerCase().startsWith("en")) {
                requireCond(!CHINESE.test(value), `${context}: Chinese text in ${JSON.stringify(value)}`);
              }
            } else if (Array.isArray(value)) {
              for (let i = 0; i < value.length; i += 1) {
                checkText(value[i], locale, `${context}[${i}]`);
              }
            } else if (isPlainObject(value)) {
              for (const [key, child] of Object.entries(value)) {
                checkText(key, "zh", `${context}.<key>`);
                checkText(child, locale, `${context}.${key}`);
              }
            }
          }

          function checkContributesEn(value, context = "manifest.contributes") {
            if (Array.isArray(value)) {
              for (let i = 0; i < value.length; i += 1) {
                checkContributesEn(value[i], `${context}[${i}]`);
              }
            } else if (isPlainObject(value)) {
              for (const [key, child] of Object.entries(value)) {
                if (key === "en") {
                  checkText(child, "en", `${context}.en`);
                } else {
                  checkContributesEn(child, `${context}.${key}`);
                }
              }
            }
          }

          function declaredSurfaces(manifest) {
            const surfaces = Array.isArray(manifest.surfaces) ? [...manifest.surfaces] : [];
            const contributes = manifest.contributes || {};
            for (const sec of contributes.settings_sections || []) {
              surfaces.push(`settings_section:${sec.id}`);
            }
            for (const panel of contributes.panels || []) {
              surfaces.push(`panel:${panel.id}`);
            }
            for (const dialog of contributes.dialogs || []) {
              surfaces.push(`dialog:${dialog.id}`);
            }
            requireCond(surfaces.length > 0, "manifest must declare at least one surface");
            return [...new Set(surfaces)];
          }

          function checkNoSymlinksAndNoPy(pkgDir) {
            const rootStat = fs.lstatSync(pkgDir);
            requireCond(!rootStat.isSymbolicLink() && rootStat.isDirectory(), `Release package dir must be a non-symlink directory: ${pkgDir}`);
            const stack = [pkgDir];
            while (stack.length > 0) {
              const cur = stack.pop();
              for (const entry of fs.readdirSync(cur, { withFileTypes: true })) {
                const fullPath = path.join(cur, entry.name);
                const st = fs.lstatSync(fullPath);
                const rel = path.relative(pkgDir, fullPath);
                requireCond(!st.isSymbolicLink(), `Symlink is not allowed in release package: ${rel}`);
                if (st.isDirectory()) {
                  stack.push(fullPath);
                } else if (st.isFile()) {
                  requireCond(!entry.name.toLowerCase().endsWith(".py"), `Python file is not allowed in JS plugin package: ${rel}`);
                }
              }
            }
          }

          function stripHtmlComments(text) {
            return text.replace(/<!--[\s\S]*?-->/g, "").replace(/<!--[\s\S]*$/g, "").trim();
          }

          function readStrictReadme(pkgDir, filename) {
            const filePath = path.join(pkgDir, filename);
            const st = fs.lstatSync(filePath, { throwIfNoEntry: false });
            requireCond(Boolean(st && !st.isSymbolicLink() && st.isFile()), `${filename} must be a non-symlink regular file`);
            const raw = fs.readFileSync(filePath);
            requireCond(raw.length <= MAX_README_BYTES, `${filename} exceeds ${MAX_README_BYTES} bytes`);
            let text;
            try {
              text = utf8Decoder.decode(raw);
            } catch (err) {
              throw new Error(`${filename} must be valid UTF-8: ${err.message}`);
            }
            text = text.replace(/^\ufeff/, "").trim();
            requireCond(Boolean(text), `${filename} must not be empty`);
            return text;
          }

          function resolveEntryJS(pkgDir, manifest) {
            const entry = manifest.entry;
            requireCond(isPlainObject(entry), "manifest.entry must be an object");
            requireCond(!entry.command && !entry.wasm, "manifest.entry must specify only entry.js");
            const rawJS = entry.js;
            requireCond(typeof rawJS === "string" && rawJS.trim() !== "", "manifest.entry.js must be a non-empty string");
            requireCond(rawJS === rawJS.trim(), "manifest.entry.js must not have leading/trailing whitespace");
            requireCond(!rawJS.includes("\0") && !rawJS.includes("\\") && !rawJS.includes(":"), `Invalid manifest.entry.js: ${JSON.stringify(rawJS)}`);
            requireCond(!rawJS.startsWith("/"), `manifest.entry.js must not be an absolute path: ${JSON.stringify(rawJS)}`);
            const parts = rawJS.split("/").filter((p) => p !== "" && p !== ".");
            requireCond(parts.length > 0 && !parts.includes(".."), `Invalid relative manifest.entry.js: ${JSON.stringify(rawJS)}`);
            const ext = path.extname(rawJS).toLowerCase();
            requireCond(ext === ".js" || ext === ".mjs", `manifest.entry.js must end with .js or .mjs: ${JSON.stringify(rawJS)}`);

            const pkgRoot = fs.realpathSync(pkgDir);
            let cur = pkgDir;
            for (const part of parts.slice(0, -1)) {
              cur = path.join(cur, part);
              const st = fs.lstatSync(cur, { throwIfNoEntry: false });
              requireCond(Boolean(st && !st.isSymbolicLink() && st.isDirectory()), `entry.js parent missing or symlink: ${JSON.stringify(rawJS)}`);
            }
            const target = path.join(cur, parts[parts.length - 1]);
            const st = fs.lstatSync(target, { throwIfNoEntry: false });
            requireCond(Boolean(st && !st.isSymbolicLink() && st.isFile()), `entry.js must be a non-symlink regular file in dist package: ${JSON.stringify(rawJS)}`);
            const resolved = fs.realpathSync(target);
            requireCond(resolved.startsWith(pkgRoot + path.sep), `entry.js escapes dist package: ${JSON.stringify(rawJS)}`);
            return resolved;
          }

          function createRuntimeHarness(harnessDir, pkgDir, entryPath) {
            const stdShimPath = path.join(harnessDir, "qjs-std-shim.mjs");
            const sdkShimPath = path.join(harnessDir, "block-sdk-shim.mjs");
            const loaderPath = path.join(harnessDir, "loader.mjs");
            const runnerPath = path.join(harnessDir, "runner.mjs");

            fs.writeFileSync(
              stdShimPath,
              `import fs from "node:fs";
          import path from "node:path";

          const pluginRoot = fs.realpathSync(process.env.BLOCK_PLUGIN_DIR);
          const oneByte = Buffer.alloc(1);

          export function loadFile(virtualPath) {
            try {
              const norm = String(virtualPath || "");
              if (!norm.startsWith("/plugin/")) return null;
              const rel = norm.slice("/plugin/".length);
              const resolved = fs.realpathSync(path.join(pluginRoot, rel));
              if (resolved !== pluginRoot && !resolved.startsWith(pluginRoot + path.sep)) return null;
              return fs.readFileSync(resolved, "utf8");
            } catch {
              return null;
            }
          }

          export const inStream = {
            getline() {
              const chunks = [];
              while (true) {
                let n = 0;
                try {
                  n = fs.readSync(0, oneByte, 0, 1, null);
                } catch (err) {
                  if (err && err.code === "EAGAIN") continue;
                  throw err;
                }
                if (n === 0) {
                  return chunks.length === 0 ? null : Buffer.concat(chunks).toString("utf8");
                }
                if (oneByte[0] === 0x0a) {
                  return Buffer.concat(chunks).toString("utf8");
                }
                if (oneByte[0] !== 0x0d) {
                  chunks.push(Buffer.from(oneByte));
                }
              }
            },
          };

          export { inStream as in };

          export const out = {
            puts(text) {
              fs.writeSync(1, String(text));
            },
            flush() {},
          };

          export const err = {
            puts(text) {
              fs.writeSync(2, String(text));
            },
            flush() {},
          };
          `,
              "utf8",
            );

            fs.writeFileSync(
              sdkShimPath,
              `import * as std from "qjs:std";

          let seq = 1000;
          const inboundQueue = [];

          export class HostRPCError extends Error {
            constructor(code, message) {
              super(message);
              this.name = "HostRPCError";
              this.code = code;
            }
          }

          export function log(...args) {
            const line = args.map((v) => {
              if (typeof v === "string") return v;
              try { return JSON.stringify(v); } catch { return String(v); }
            }).join(" ");
            std.err.puts(line + "\\n");
            std.err.flush();
          }

          export function send(obj) {
            std.out.puts(JSON.stringify(obj) + "\\n");
            std.out.flush();
          }

          export function notifyHost(method, params = {}) {
            send({ jsonrpc: "2.0", method, params: params ?? {} });
          }

          function readMessageLine() {
            while (true) {
              const line = std.in.getline();
              if (line === null || line === undefined) return null;
              const trimmed = line.trim();
              if (!trimmed) continue;
              try {
                const msg = JSON.parse(trimmed);
                if (msg && typeof msg === "object" && !Array.isArray(msg)) return msg;
              } catch {}
            }
          }

          export function callHost(method, params = {}) {
            seq += 1;
            const reqId = \`p-\${seq}\`;
            send({ jsonrpc: "2.0", id: reqId, method, params: params ?? {} });
            while (true) {
              const msg = readMessageLine();
              if (msg === null) throw new Error("stdin closed while awaiting host response");
              const isResponse = msg.id !== undefined && msg.id !== null && String(msg.id) === reqId && !msg.method && ("result" in msg || "error" in msg);
              if (isResponse) {
                if (msg.error) {
                  const code = typeof msg.error.code === "number" ? msg.error.code : -32000;
                  throw new HostRPCError(code, msg.error.message || "host error");
                }
                return msg.result ?? {};
              }
              inboundQueue.push(msg);
            }
          }

          export function serve(handler) {
            if (typeof handler !== "function") throw new TypeError("serve(handler) requires a function");
            while (true) {
              const req = inboundQueue.length > 0 ? inboundQueue.shift() : readMessageLine();
              if (req === null) break;
              const method = req.method;
              if (typeof method !== "string" || !method) continue;
              const reqId = req.id;
              const params = req.params && typeof req.params === "object" && !Array.isArray(req.params) ? req.params : {};
              try {
                const result = handler(method, params, req);
                if (reqId !== undefined && reqId !== null) {
                  send({ jsonrpc: "2.0", id: reqId, result: result === undefined ? null : result });
                }
                if (method === "plugin.shutdown") break;
              } catch (err) {
                if (reqId !== undefined && reqId !== null) {
                  const message = err && err.message ? String(err.message) : String(err);
                  const code = err && typeof err.code === "number" ? err.code : -32000;
                  send({ jsonrpc: "2.0", id: reqId, error: { code, message } });
                }
                if (method === "plugin.shutdown") break;
              }
            }
          }
          `,
              "utf8",
            );

            fs.writeFileSync(
              loaderPath,
              `import { pathToFileURL } from "node:url";
          const stdUrl = pathToFileURL(${JSON.stringify(stdShimPath)}).href;
          const sdkUrl = pathToFileURL(${JSON.stringify(sdkShimPath)}).href;

          export async function resolve(specifier, context, nextResolve) {
            if (specifier === "qjs:std") return { shortCircuit: true, url: stdUrl };
            if (specifier === "/runtime/block-sdk.js") return { shortCircuit: true, url: sdkUrl };
            return nextResolve(specifier, context);
          }
          `,
              "utf8",
            );

            fs.writeFileSync(
              runnerPath,
              `import { register } from "node:module";
          import { pathToFileURL } from "node:url";

          register(pathToFileURL(${JSON.stringify(loaderPath)}).href);
          await import(pathToFileURL(${JSON.stringify(entryPath)}).href);
          `,
              "utf8",
            );

            return runnerPath;
          }

          async function runPlugin(entryPath, pkgDir, locale, tmpDir, pluginId, surfaces) {
            const dataDir = path.join(tmpDir, "data");
            const downloads = path.join(tmpDir, "downloads");
            const harnessDir = path.join(tmpDir, "harness");
            fs.mkdirSync(dataDir, { recursive: true });
            fs.mkdirSync(downloads, { recursive: true });
            fs.mkdirSync(harnessDir, { recursive: true });

            const runnerPath = createRuntimeHarness(harnessDir, pkgDir, entryPath);
            const storage = {};
            let entries = { "welcome.md": { icon: "star", tint: "blue" } };
            let prefs = { picker: true, sync_tabs: true };

            function host(method, params) {
              if (method === "host.storage.get") {
                const key = params.key;
                if (Object.prototype.hasOwnProperty.call(storage, key)) {
                  return { found: true, value: storage[key] };
                }
                return { found: false };
              }
              if (method === "host.storage.set") {
                storage[params.key] = params.value;
                return { ok: true };
              }
              if (method === "host.sidebar.get_file_icons") {
                return {
                  entries: { ...entries },
                  recent: ["star"],
                  prefs: { ...prefs },
                  notebook_root: "/tmp/notebook",
                };
              }
              if (method === "host.sidebar.set_file_icons") {
                if (params.clear) {
                  entries = {};
                }
                if (isPlainObject(params.prefs)) {
                  prefs = { ...prefs, ...params.prefs };
                }
                return { ok: true };
              }
              throw new Error(`Unexpected host RPC ${method}`);
            }

            const child = spawn(process.execPath, [runnerPath], {
              cwd: pkgDir,
              env: { ...process.env, BLOCK_PLUGIN_DIR: pkgDir },
              stdio: ["pipe", "pipe", "pipe"],
            });

            let stderrText = "";
            child.stderr.on("data", (chunk) => {
              stderrText += chunk.toString("utf8");
            });

            const lines = [];
            const waiters = [];
            let closed = false;
            let buf = "";

            child.stdout.on("data", (chunk) => {
              buf += chunk.toString("utf8");
              while (true) {
                const idx = buf.indexOf("\n");
                if (idx < 0) break;
                const line = buf.slice(0, idx).replace(/\r$/, "");
                buf = buf.slice(idx + 1);
                if (waiters.length > 0) {
                  waiters.shift()(line);
                } else {
                  lines.push(line);
                }
              }
            });

            child.stdout.on("end", () => {
              closed = true;
              while (waiters.length > 0) {
                waiters.shift()(null);
              }
            });

            function nextLine(timeoutMs = 10000) {
              if (lines.length > 0) {
                return Promise.resolve(lines.shift());
              }
              if (closed) {
                return Promise.resolve(null);
              }
              return new Promise((resolve, reject) => {
                const timer = setTimeout(() => {
                  const idx = waiters.indexOf(onLine);
                  if (idx >= 0) waiters.splice(idx, 1);
                  reject(new Error(`${locale}: timed out awaiting plugin response (stderr=${stderrText})`));
                }, timeoutMs);
                function onLine(line) {
                  clearTimeout(timer);
                  resolve(line);
                }
                waiters.push(onLine);
              });
            }

            function send(msg) {
              child.stdin.write(JSON.stringify({ jsonrpc: "2.0", ...msg }) + "\n");
            }

            let requestId = 0;
            async function rpc(method, params = {}) {
              requestId += 1;
              const id = requestId;
              send({ id, method, params });
              while (true) {
                const line = await nextLine();
                requireCond(line !== null, `${locale}: plugin exited during ${method} (stderr=${stderrText})`);
                const message = JSON.parse(line);
                requireCond(message.jsonrpc === "2.0", `${method}: invalid JSON-RPC version`);
                if (typeof message.method === "string") {
                  const result = host(message.method, message.params || {});
                  send({ id: message.id, result });
                  continue;
                }
                requireCond(message.id === id, `${method}: unexpected response id`);
                requireCond(!message.error, `${method}: ${JSON.stringify(message.error)}`);
                return message.result;
              }
            }

            try {
              const init = await rpc("plugin.initialize", {
                plugin_id: pluginId,
                locale,
                data_dir: dataDir,
                downloads_dir: downloads,
                ui_capabilities: ["kv_tooltip"],
              });
              requireCond(init && init.ready === true, `${locale}: plugin not ready`);

              const pages = {};
              for (const surface of surfaces) {
                const res = await rpc("plugin.render", { surface });
                const page = res.page;
                requireCond(typeof page?.title === "string" && page.title.trim() !== "", `${locale} ${surface}: missing page title`);
                checkText(page, locale, `${locale} ${surface}`);
                pages[surface] = page;
              }

              const rendered = await rpc("plugin.render", {
                surface: "settings_page",
                values: { picker: false, sync_tabs: false },
              });
              checkText(rendered.page, locale, `${locale} toggle`);
              requireCond(prefs.picker === false && prefs.sync_tabs === false, `${locale}: expected prefs false, got ${JSON.stringify(prefs)}`);
              requireCond(storage.prefs?.picker === false && storage.prefs?.sync_tabs === false, `${locale}: storage not updated`);

              const act = await rpc("plugin.action", {
                surface: "settings_page",
                action_id: "reset_notebook",
                values: {},
              });
              requireCond(act.ok === true, `${locale}: reset_notebook failed`);
              checkText(act.status, locale, `${locale} reset_notebook.status`);
              checkText(act.page, locale, `${locale} reset_notebook.page`);
              requireCond(Object.keys(entries).length === 0, `${locale}: reset_notebook did not clear entries`);

              const ev = await rpc("plugin.event", { event: "note.saved", path: "welcome.md" });
              requireCond("handled" in ev, `${locale}: invalid plugin.event response`);

              const shutdown = await rpc("plugin.shutdown");
              requireCond(shutdown && shutdown.ok === true, `${locale}: shutdown failed`);

              const exitCode = await new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error(`${locale}: plugin did not exit`)), 10000);
                child.once("exit", (code) => {
                  clearTimeout(timer);
                  resolve(code);
                });
              });
              requireCond(exitCode === 0, `${locale}: plugin exited non-zero (${exitCode})`);
              return pages;
            } finally {
              if (child.exitCode === null) {
                child.kill("SIGKILL");
              }
              child.stdin.destroy();
            }
          }

          async function validateStagedPackage(pkgDir) {
            checkNoSymlinksAndNoPy(pkgDir);

            const manifestPath = path.join(pkgDir, "manifest.json");
            const manifestStat = fs.lstatSync(manifestPath, { throwIfNoEntry: false });
            requireCond(Boolean(manifestStat && !manifestStat.isSymbolicLink() && manifestStat.isFile()), "Staged package missing manifest.json");
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            const pluginId = typeof manifest.id === "string" ? manifest.id.trim() : "";
            requireCond(Boolean(pluginId), "Missing manifest.id");

            const name = manifest.name || {};
            const summaryObj = manifest.summary || {};
            requireCond(typeof name.en === "string" && name.en.trim() !== "", "manifest.name.en is required");
            requireCond(typeof summaryObj.en === "string" && summaryObj.en.trim() !== "", "manifest.summary.en is required");
            checkText(name.en, "en", "manifest.name.en");
            checkText(summaryObj.en, "en", "manifest.summary.en");
            for (const [perm, reason] of Object.entries(manifest.permission_reasons || {})) {
              requireCond(isPlainObject(reason) && typeof reason.en === "string" && reason.en.trim() !== "", `manifest.permission_reasons.${perm}.en is required`);
              checkText(reason.en, "en", `manifest.permission_reasons.${perm}.en`);
            }
            checkText(manifest, "zh", "manifest");
            checkContributesEn(manifest.contributes);

            const iconsPath = path.join(pkgDir, "icons.json");
            const iconsStat = fs.lstatSync(iconsPath, { throwIfNoEntry: false });
            requireCond(Boolean(iconsStat && !iconsStat.isSymbolicLink() && iconsStat.isFile()), "Staged package missing icons.json");
            const pack = JSON.parse(fs.readFileSync(iconsPath, "utf8"));
            const packKeys = Object.keys(pack).sort().join(",");
            requireCond(packKeys === "categories,icons,schema_version", "icons.json unexpected top-level keys");
            requireCond(pack.schema_version === 1, "icons.json schema_version must be 1");
            requireCond(Array.isArray(pack.categories) && pack.categories.length === 8, `icons.json expected 8 categories, got ${pack.categories?.length}`);
            requireCond(Array.isArray(pack.icons) && pack.icons.length === 96, `icons.json expected 96 icons, got ${pack.icons?.length}`);
            for (const cat of pack.categories) {
              checkText(cat.name.zh, "zh", `icons.json category ${cat.id} zh`);
              checkText(cat.name.en, "en", `icons.json category ${cat.id} en`);
            }
            for (const ic of pack.icons) {
              checkText(ic.name.zh, "zh", `icons.json icon ${ic.id} zh`);
              checkText(ic.name.en, "en", `icons.json icon ${ic.id} en`);
              checkText(ic.keywords || [], "zh", `icons.json icon ${ic.id} keywords`);
            }

            const zhReadme = readStrictReadme(pkgDir, "README.md");
            const enReadme = readStrictReadme(pkgDir, "README.en.md");
            requireCond(HAN.test(stripHtmlComments(zhReadme)), "README.md must contain visible Chinese text");
            requireCond(!CHINESE.test(enReadme), "README.en.md must contain English-only text");
            requireCond(/[A-Za-z]/.test(stripHtmlComments(enReadme)), "README.en.md must contain at least one visible ASCII letter");
            checkText(zhReadme, "zh", "README.md");
            checkText(enReadme, "en", "README.en.md");
            requireCond(zhReadme !== enReadme, "The two README files must differ");

            const surfaces = declaredSurfaces(manifest);
            const entryPath = resolveEntryJS(pkgDir, manifest);
            const tzh = fs.mkdtempSync(path.join(os.tmpdir(), "block-file-icons-zh-"));
            const ten = fs.mkdtempSync(path.join(os.tmpdir(), "block-file-icons-en-"));
            try {
              const zhPages = await runPlugin(entryPath, pkgDir, "zh", tzh, pluginId, surfaces);
              const enPages = await runPlugin(entryPath, pkgDir, "en", ten, pluginId, surfaces);
              for (const surface of surfaces) {
                requireCond(zhPages[surface].title !== enPages[surface].title, `${surface}: Chinese and English page titles must differ`);
                requireCond(JSON.stringify(zhPages[surface]) !== JSON.stringify(enPages[surface]), `${surface}: Chinese and English rendered pages must differ`);
              }
            } finally {
              fs.rmSync(tzh, { recursive: true, force: true });
              fs.rmSync(ten, { recursive: true, force: true });
            }
            console.log("Bilingual release gate passed on staged dist package.");
          }

          function sh(cmd, args, opts = {}) {
            return execFileSync(cmd, args, { encoding: "utf8", ...opts }).trim();
          }

          function shOk(cmd, args) {
            try {
              execFileSync(cmd, args, { stdio: "ignore" });
              return true;
            } catch {
              return false;
            }
          }

          function summary(msg) {
            console.log(msg);
            const sPath = process.env.GITHUB_STEP_SUMMARY;
            if (sPath) {
              fs.appendFileSync(sPath, msg + "\n", "utf8");
            }
          }

          function setOutput(fields) {
            const oPath = process.env.GITHUB_OUTPUT;
            if (oPath) {
              const lines = Object.entries(fields).map(([k, v]) => `${k}=${v}`).join("\n") + "\n";
              fs.appendFileSync(oPath, lines, "utf8");
            }
          }

          function parseVer(tag) {
            const m = String(tag || "").trim().match(/^v?(\d+)\.(\d+)\.(\d+)$/);
            return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
          }

          function cmpVer(a, b) {
            for (let i = 0; i < 3; i += 1) {
              if (a[i] !== b[i]) return a[i] - b[i];
            }
            return 0;
          }

          function verKey(v) {
            return `${v[0]}.${v[1]}.${v[2]}`;
          }

          function shanghaiDateStr(date = new Date()) {
            return new Date(date.getTime() + 8 * 3600 * 1000).toISOString().slice(0, 10);
          }

          const repo = process.env.REPO;
          const event = process.env.EVENT_NAME;
          const refName = process.env.REF_NAME;
          const force = process.env.FORCE === "true";

          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          requireCond(manifest.app === "blockmd", "manifest.app must be 'blockmd'");
          const pluginId = manifest.id.trim();
          requireCond(/^[a-z0-9][a-z0-9-]{1,47}$/.test(pluginId), `invalid id: ${pluginId}`);
          const baseVer = manifest.version.trim();
          const mBase = baseVer.match(/^(\d+)\.(\d+)\.(\d+)$/);
          requireCond(Boolean(mBase), `manifest.version must be X.Y.Z, got ${baseVer}`);
          const baseMajor = Number(mBase[1]);
          const baseMinor = Number(mBase[2]);
          const pluginTitle = (manifest.name?.en || pluginId).trim();

          const headSha = sh("git", ["rev-parse", "HEAD"]);
          const rawRels = sh("gh", ["api", "--paginate", `repos/${repo}/releases?per_page=100`, "--jq", ".[]"]);
          const releases = rawRels.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => JSON.parse(l));
          const stable = releases
            .filter((r) => !r.draft && !r.prerelease && parseVer(r.tag_name))
            .sort((a, b) => cmpVer(parseVer(a.tag_name), parseVer(b.tag_name)));
          const previous = stable.length > 0 ? stable[stable.length - 1] : null;

          const taken = new Set();
          for (const r of releases) {
            const pv = parseVer(r.tag_name);
            if (pv) taken.add(verKey(pv));
          }
          for (const t of sh("git", ["tag", "--list", "v*"]).split("\n")) {
            const pv = parseVer(t);
            if (pv) taken.add(verKey(pv));
          }

          function resolveTagSha(rel) {
            if (!rel) return "";
            const tag = rel.tag_name;
            try {
              const s = sh("git", ["rev-parse", `${tag}^{commit}`]);
              if (/^[0-9a-f]{40}$/.test(s)) return s;
            } catch {}
            try {
              const s = sh("gh", ["api", `repos/${repo}/commits/${tag}`, "--jq", ".sha"]);
              if (/^[0-9a-f]{40}$/.test(s)) return s;
            } catch {}
            return "";
          }

          let version;
          let tag;
          let prevSha = "";

          if (event === "push" && refName.startsWith("v")) {
            const pv = parseVer(refName);
            requireCond(Boolean(pv), `Tag ${refName} must match vX.Y.Z`);
            version = verKey(pv);
            tag = `v${version}`;
            const prevForNotes = [...stable].reverse().find((r) => r.tag_name !== tag) || null;
            prevSha = resolveTagSha(prevForNotes);
          } else {
            if (event === "schedule" && !force && previous && previous.published_at) {
              const today = shanghaiDateStr();
              const pubDay = shanghaiDateStr(new Date(previous.published_at));
              if (today === pubDay) {
                summary(`今日（${today}）已发布过 ${previous.tag_name}，每日定时最多自动发布一次，本次跳过。`);
                setOutput({ should_release: "no" });
                process.exit(0);
              }
            }

            prevSha = resolveTagSha(previous);
            if (prevSha && prevSha === headSha && !force) {
              summary(`当前 HEAD (${headSha.slice(0, 7)}) 与最新 Release ${previous.tag_name} 一致，跳过发版。`);
              setOutput({ should_release: "no" });
              process.exit(0);
            }

            if (prevSha && !force && shOk("git", ["merge-base", "--is-ancestor", prevSha, headSha])) {
              const changed = sh("git", ["diff", "--name-only", prevSha, headSha])
                .split("\n")
                .filter((p) => p && !p.startsWith(".github/") && p !== ".gitignore" && p !== "LICENSE");
              if (changed.length === 0) {
                summary(`自 ${previous.tag_name} 以来仅包含 CI 或仓库元数据变更，无需发包，本次跳过。`);
                setOutput({ should_release: "no" });
                process.exit(0);
              }
              const subjects = sh("git", ["log", "--no-merges", "--format=%s", `${prevSha}..${headSha}`])
                .split("\n")
                .filter(Boolean);
              if (subjects.length > 0 && subjects.every((s) => s.toLowerCase().includes("[skip release]"))) {
                summary("区间内提交均标记 [skip release]，本次跳过。");
                setOutput({ should_release: "no" });
                process.exit(0);
              }
            }

            const commitCount = Number(sh("git", ["rev-list", "--count", headSha]));
            let cand = [baseMajor, baseMinor, commitCount];
            let highest = null;
            for (const k of taken) {
              const v = parseVer(k);
              if (!highest || cmpVer(v, highest) > 0) highest = v;
            }
            if (highest && cmpVer(cand, highest) <= 0) {
              cand = [highest[0], highest[1], highest[2] + 1];
            }
            while (taken.has(verKey(cand))) {
              cand = [cand[0], cand[1], cand[2] + 1];
            }
            version = verKey(cand);
            tag = `v${version}`;
          }

          const notesLines = [];
          if (prevSha && prevSha !== headSha && shOk("git", ["merge-base", "--is-ancestor", prevSha, headSha])) {
            const rawLog = sh("git", ["log", "--no-merges", "--reverse", "--format=%h%x00%s", `${prevSha}..${headSha}`]);
            for (const line of rawLog.split("\n")) {
              if (!line.trim()) continue;
              const sepIdx = line.indexOf("\0");
              const cSha = line.slice(0, sepIdx);
              const subj = line.slice(sepIdx + 1);
              if (/^(?:ci|docs)(?:\([^)]*\))?:\s/i.test(subj)) continue;
              notesLines.push(`- ${subj} (\`${cSha}\`)`);
            }
          }
          if (notesLines.length === 0) {
            notesLines.push(`- Automated release from \`${headSha.slice(0, 7)}\`.`);
          }
          fs.writeFileSync("release-notes.md", "## Changes\n\n" + notesLines.join("\n") + "\n", "utf8");

          const pkgDir = path.join("dist", pluginId);
          fs.rmSync("dist", { recursive: true, force: true });
          fs.mkdirSync(pkgDir, { recursive: true });
          const tarBytes = execFileSync("git", ["archive", "--format=tar", headSha]);
          execFileSync("tar", ["-xf", "-", "-C", pkgDir], { input: tarBytes });
          fs.rmSync(path.join(pkgDir, ".github"), { recursive: true, force: true });
          const gitignorePath = path.join(pkgDir, ".gitignore");
          const giStat = fs.lstatSync(gitignorePath, { throwIfNoEntry: false });
          if (giStat && !giStat.isSymbolicLink()) {
            fs.rmSync(gitignorePath, { force: true });
          }

          try {
            checkNoSymlinksAndNoPy(pkgDir);
          } catch (err) {
            console.error(`Bilingual release gate failed: ${err.message}`);
            process.exit(1);
          }

          manifest.version = version;
          fs.writeFileSync(path.join(pkgDir, "manifest.json"), JSON.stringify(manifest, null, 2) + "\n", "utf8");

          try {
            await validateStagedPackage(pkgDir);
          } catch (err) {
            console.error(`Bilingual release gate failed: ${err.message}`);
            process.exit(1);
          }

          const archiveName = `${pluginId}-${tag}.tar.gz`;
          execFileSync("tar", ["-czf", archiveName, "-C", "dist", pluginId]);

          summary(`准备发布 ${pluginTitle} ${tag} (archive=${archiveName}, commit=${headSha.slice(0, 7)})`);
          setOutput({
            should_release: "yes",
            version,
            tag,
            title: `${pluginTitle} ${version}`,
            archive: archiveName,
            head_sha: headSha,
          });
          JS

      # 更新说明只经 tailnet 用 Magpie：Mac 在线先用 Mac 的 agy-cli/gemini-3.8-flash，再 VPS gpt-6-luna，最后 deepseek-flash。
      # 与 Block 主仓 scripts/release/release-notes.mjs 的顺序保持一致；不要用 Google AI Studio key。
      - name: Join tailnet
        id: tailscale
        if: steps.plan.outputs.should_release == 'yes'
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-release-notes
          version: "1.104.4"
          ping: "100.115.90.80"
          timeout: 1m
          retry: "2"
          args: --shields-up

      - name: Write release notes with AI
        if: steps.plan.outputs.should_release == 'yes'
        env:
          TAILNET: ${{ steps.tailscale.outcome }}
        run: |
          reach() { timeout "$3" bash -c "echo >/dev/tcp/$1/$2" 2>/dev/null && echo yes || echo no; }
          if [ "$TAILNET" = "success" ]; then
            export MAGPIE_REACHABLE=$(reach 100.115.90.80 3425 10)
            export MAC_MAGPIE_REACHABLE=$(reach 100.118.27.43 3425 8)
          else
            export MAGPIE_REACHABLE=no MAC_MAGPIE_REACHABLE=no
          fi
          node .github/scripts/release-notes.mjs release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: steps.plan.outputs.should_release == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          ARCHIVE: ${{ steps.plan.outputs.archive }}
          HEAD_SHA: ${{ steps.plan.outputs.head_sha }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md --draft=false --latest
            gh release upload "${TAG}" "${ARCHIVE}" --clobber
          else
            gh release create "${TAG}" "${ARCHIVE}" \
              --target "${HEAD_SHA}" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --latest
          fi
